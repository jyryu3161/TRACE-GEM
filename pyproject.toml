[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metatask-gapfill"
version = "0.2.0"
description = "Metabolic-task-aware gap-filling with KEGG reaction evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jaeyong Ryu"},
]
dependencies = [
    "cobra>=0.29.0",
    "PySide6>=6.6.0,<6.9",
    "pyqtgraph>=0.13.0,<0.14",
    "biopython>=1.83",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.3",
    "pytest-cov>=4.1",
    "aioresponses>=0.7",
    "ruff>=0.12",
    "mypy>=1.10",
]
# Model construction toolchain (CarveMe + MILP solvers). The `diamond` binary
# is NOT pip-installable — install it via conda (bioconda) or brew. See
# environment.yml for the one-command reproducible setup.
build = [
    "carveme>=1.6",
    "gurobipy>=11.0",
    "pyscipopt>=5.0",
]

[project.scripts]
metatask-gapfill = "src.app:main"
metatask-gapfill-cli = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.data-files]
"share/metatask-gapfill/data" = [
    "data/bigg_universal_model_fixed.json",
    "data/universal_essential_tasks.csv",
    "data/iML1515.xml",
    "data/e_coli_core.xml",
    "data/eco_protein.faa",
    "data/cgb_protein.faa",
    "data/evidence_benchmark_template.csv",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that invoke real external binaries (carve/diamond/solver); deselect with -m 'not integration'",
]
